server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Web 健康检查端点
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 静态资源缓存
    location ~* \.(?:js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
